<main class="chat-panel">

    <div class="chat-header">

        <h3>Conversation</h3>

    </div>

    <div
            id="chatHistory"
            class="chat-history">

        <div class="ai-message">

            👋 欢迎来到

            <strong>{{ category_name }}</strong>

            知识库。

            <br><br>

            请选择左侧知识，

            或直接向 AI 提问。

        </div>

    </div>

    <div class="chat-input">

        <textarea

                id="questionInput"

                placeholder="输入你的问题..."></textarea>

        <button

                id="sendQuestion">

            发送

        </button>

    </div>

</main>
