<aside class="sidebar">

    <!-- 我的知识库 -->

    <div class="card">

        <h3>我的知识库</h3>

        <ul class="category-list">

            <li>🔬 科学</li>

            <li class="active">💻 科技</li>

            <li>📚 人文</li>

            <li>🌍 社会</li>

            <li>❤️ 健康</li>

        </ul>

    </div>

    <!-- 当前分类 -->

    <div class="card">

        <h3>当前分类</h3>

        <div class="knowledge-list">

            {% for item in knowledge_list %}

            <div class="knowledge-item">

                <h4>{{ item.title }}</h4>

                <p>{{ item.description }}</p>

            </div>

            {% endfor %}

        </div>

    </div>

    <!-- 快捷功能 -->

    <div class="card">

        <h3>快捷功能</h3>

        <button>⭐ 收藏夹</button>

        <button>📜 历史记录</button>

        <button>⚙ 设置</button>

    </div>

</aside>
